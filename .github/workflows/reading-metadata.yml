name: Update Reading metadata

on:
  push:
    branches: [main]
    paths:
      - reading/papers.js
      - scripts/update_reading_metadata.py
      - .github/workflows/reading-metadata.yml
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: reading-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch paper metadata
        id: metadata
        continue-on-error: true
        run: python scripts/update_reading_metadata.py
      - name: Commit updated cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Reading paper metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report retrieval failures
        if: steps.metadata.outcome == 'failure'
        run: |
          echo 'Some metadata requests failed. Previous cache is preserved; see the fetch log. The next scheduled run will retry.'
          exit 1
