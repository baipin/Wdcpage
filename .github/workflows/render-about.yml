name: Render homepage Markdown

on:
  push:
    branches: [main]
    paths:
      - pages/about.md
      - index.html
      - scripts/render_about.py
      - scripts/requirements.txt
      - .github/workflows/render-about.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-homepage-markdown
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/render_about.py
      - run: python scripts/render_about.py --check
      - name: Commit rendered homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Render homepage About Markdown'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
