<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>About - WANG Dingchao</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="https://unpkg.com/mdui@2.0.3/mdui.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://unpkg.com/mdui@2.0.3/mdui.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --nav-height: 70px; --content-max-width: 980px; --radius-card: 28px; }
    html { background:#f5f5f7; transition: background-color .3s; }
    html.mdui-theme-dark { background:#0a0a0c; }
    body { margin:0; padding-top:var(--nav-height); font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }

    body::before {
      content:""; position:fixed; inset:0; background:url('/img/home.jpg') center/cover no-repeat;
      z-index:-2; opacity:.9;
    }
    .mdui-theme-dark body::before { filter:brightness(.7) contrast(1.05); }
    body::after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background: radial-gradient(circle at 20% 30%, rgba(0,0,0,.04), rgba(0,0,0,.12)); }
    .mdui-theme-dark body::after {
      background: radial-gradient(circle at 20% 30%, rgba(0,0,0,.28), rgba(0,0,0,.48));
    }

    .custom-app-bar {
      height:var(--nav-height)!important; position:fixed; top:0; left:0; right:0; z-index:1100;
      display:flex; align-items:center; padding:0 6%;
      background:rgba(255,255,255,.94)!important; backdrop-filter: blur(24px);
      border-bottom:1px solid rgba(0,0,0,.06); color:#111827;
    }
    .mdui-theme-dark .custom-app-bar {
      background:rgba(18,18,24,.94)!important; color:#f3f4f6; border-bottom-color:rgba(255,255,255,.08);
    }
    .nav-logo { display:flex; align-items:center; gap:12px; font-weight:700; font-size:1.25rem; color:inherit; cursor:pointer; }
    .nav-logo img { height:36px; width:auto; }
    .nav-links-container { margin-left:32px; display:flex; gap:8px; }
    .mobile-menu-btn { display:none; }
    @media (max-width:860px) { .nav-links-container{display:none;} .mobile-menu-btn{display:inline-flex!important;} .custom-app-bar{padding:0 5%;} }

    .container { max-width:var(--content-max-width); margin:36px auto 70px; width:calc(100% - 40px); position: relative; z-index: 30; }
    .about-card {
      border-radius:var(--radius-card); padding:28px 24px; background: rgba(255,255,255,0.97); color:#121212;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,.2);
    }
    .mdui-theme-dark .about-card { background: rgba(28,28,34,0.98); color:#efefef; }

    .about-md { line-height:1.72; font-size:1rem; }
    .about-md img { max-width:100%; height:auto; border-radius:14px; }
    .about-md a { color:#0f7b6e; text-decoration:underline; }
    .about-md h1,.about-md h2,.about-md h3 { margin-top:1.2rem; margin-bottom:.5rem; }

    .mdui-theme-light mdui-button[variant="text"], .mdui-theme-light mdui-button-icon, .mdui-theme-light mdui-icon { color:#111827!important; }
    .mdui-theme-dark mdui-button[variant="text"], .mdui-theme-dark mdui-button-icon, .mdui-theme-dark mdui-icon { color:#f3f4f6!important; }
  </style>
</head>
<body class="mdui-theme-auto">
  <mdui-navigation-drawer id="drawer" placement="right" close-on-overlay-click>
    <div style="padding: 28px 20px 8px;"><h2 style="margin:0; font-weight: 700;">Explore</h2></div>
    <mdui-list id="drawer-list">
      <mdui-list-item icon="home" href="/index.html">Home</mdui-list-item>
      <mdui-list-item icon="auto_stories" href="https://baipin.pw">Blog</mdui-list-item>
      <mdui-list-item icon="terminal" href="https://www.baipon.com/projects.html">Projects</mdui-list-item>
      <mdui-list-item icon="account_circle" href="/about.html">About</mdui-list-item>
    </mdui-list>
  </mdui-navigation-drawer>

  <header class="custom-app-bar">
    <div class="nav-logo" onclick="window.location.href='/index.html'">
      <img src="/img/logo.png" alt="logo">
      <span>WANG Dingchao</span>
    </div>
    <div class="nav-links-container">
      <mdui-button variant="text" href="/index.html"><mdui-icon slot="icon" name="home"></mdui-icon>Home</mdui-button>
      <mdui-button variant="text" href="https://baipin.pw"><mdui-icon slot="icon" name="auto_stories"></mdui-icon>Blog</mdui-button>
      <mdui-button variant="text" href="https://www.baipon.com/projects.html"><mdui-icon slot="icon" name="terminal"></mdui-icon>Projects</mdui-button>
      <mdui-button variant="text" href="/about.html"><mdui-icon slot="icon" name="account_circle"></mdui-icon>About</mdui-button>
    </div>
    <div style="flex-grow:1"></div>
    <mdui-button-icon id="theme-toggle" icon="light_mode"></mdui-button-icon>
    <mdui-button-icon icon="menu" class="mobile-menu-btn" onclick="document.getElementById('drawer').open = true"></mdui-button-icon>
  </header>

  <main class="container">
    <section class="about-card">
      <h1 style="margin:0 0 12px; font-size:2.2rem;">About</h1>
      <p style="opacity:.8; margin:0 0 20px;">This page is rendered from <code>pages/about.md</code>.</p>
      <div id="about-content" class="about-md"><mdui-circular-progress></mdui-circular-progress> Loading...</div>
    </section>
  </main>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const htmlElem = document.documentElement;
    const drawer = document.getElementById('drawer');

    function updateThemeIcon() {
      const isDark = htmlElem.classList.contains('mdui-theme-dark') ||
        (htmlElem.classList.contains('mdui-theme-auto') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      themeToggle.icon = isDark ? 'dark_mode' : 'light_mode';
    }

    function applyTheme(theme) {
      htmlElem.classList.remove('mdui-theme-light', 'mdui-theme-dark', 'mdui-theme-auto');
      htmlElem.classList.add(`mdui-theme-${theme}`);
      const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      htmlElem.setAttribute('data-theme-resolved', isDark ? 'dark' : 'light');
      if (drawer) drawer.style.colorScheme = isDark ? 'dark' : 'light';
      updateThemeIcon();
    }

    themeToggle.addEventListener('click', () => {
      const isDark = htmlElem.classList.contains('mdui-theme-dark') ||
        (htmlElem.classList.contains('mdui-theme-auto') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const nextTheme = isDark ? 'light' : 'dark';
      applyTheme(nextTheme);
      localStorage.setItem('theme', nextTheme);
    });

    document.getElementById('drawer-list')?.addEventListener('click', () => { drawer.open = false; });
    applyTheme(localStorage.getItem('theme') || 'auto');
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (localStorage.getItem('theme') === 'auto') applyTheme('auto');
    });

    async function loadAboutMarkdown() {
      const aboutContainer = document.getElementById('about-content');
      try {
        const response = await fetch('pages/about.md');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdownText = await response.text();
        aboutContainer.innerHTML = marked.parse(markdownText);
      } catch (err) {
        aboutContainer.innerHTML = '<div style="opacity:.85">Unable to load <strong>pages/about.md</strong>.</div>';
      }
    }
    loadAboutMarkdown();
  </script>
</body>
</html>
